server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: trading-webhook-receiver-java

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

trading:
  webhook:
    secret: ${WEBHOOK_SECRET:}
  aws:
    region: ${AWS_REGION:eu-west-1}
    sqs:
      queue-url: ${AWS_SQS_QUEUE_URL:}