name: CI - Pull Request

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/**
      - fix/**

permissions:
  contents: read
  pull-requests: read

jobs:
  python-backend-ci:
    name: Python Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: |
          ruff check .

      - name: Pytest with coverage
        run: |
          pytest --cov=app --cov-report=xml

      - name: Upload Python coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: backend/coverage.xml

  java-receiver-ci:
    name: Java Receiver CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: trading-webhook-receiver-java

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven test
        run: |
          chmod +x mvnw
          ./mvnw test

      - name: Maven package
        run: |
          ./mvnw clean package -DskipTests

      - name: Upload Java artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-receiver-jar
          path: trading-webhook-receiver-java/target/*.jar

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs:
      - python-backend-ci
      - java-receiver-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Python coverage
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: backend

      - name: Setup JDK 21 for Sonar
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Java classes for Sonar
        working-directory: trading-webhook-receiver-java
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}